name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Verify Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libharfbuzz0b \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: |
          python -m unittest discover tests

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            artifact_name: css-editor-linux-x86_64.tar.gz
            binary_name: css-editor
            is_windows: false

          - os: macos-14
            target: macos-arm64
            artifact_name: css-editor-macos-arm64.tar.gz
            binary_name: css-editor
            is_windows: false

          - os: macos-13
            target: macos-x86_64
            artifact_name: css-editor-macos-x86_64.tar.gz
            binary_name: css-editor
            is_windows: false

          - os: windows-latest
            target: windows-x64
            artifact_name: css-editor-windows-x64.zip
            binary_name: css-editor.exe
            is_windows: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libharfbuzz0b \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pango cairo gdk-pixbuf libffi

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-pango mingw-w64-x86_64-cairo mingw-w64-x86_64-gdk-pixbuf2 mingw-w64-x86_64-libffi
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build standalone executable with PyInstaller
        run: |
          python -m PyInstaller --clean css-editor.spec

      - name: Verify executable runs
        shell: bash
        run: |
          if [ "${{ matrix.is_windows }}" = "true" ]; then
            ./dist/css-editor.exe --version
          else
            chmod +x ./dist/css-editor
            ./dist/css-editor --version
          fi

      - name: Package archive (Unix)
        if: matrix.is_windows == false
        shell: bash
        run: |
          cd dist
          tar -czvf "../${{ matrix.artifact_name }}" "${{ matrix.binary_name }}"
          cd ..

      - name: Package archive (Windows)
        if: matrix.is_windows == true
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\${{ matrix.binary_name }}" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  create-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256 Checksums
        working-directory: release-artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
